name: Workflow CI

on:
  push:
    branches: [ master, main, code-audit-and-improvements ]
  pull_request:
    branches: [ master, main, code-audit-and-improvements ]

jobs:
  validate-workflow:
    name: Snakemake DAG & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Snakemake & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snakemake pandas pyyaml

      - name: Validate Snakemake DAG & Syntax (Test Config)
        run: |
          cd workflow
          snakemake -n --configfile config/config_test.yml
