# ==============================================================================
# General Settings
# ==============================================================================
experiment: "test_run"        # Label for experiment (used in output filenames)
data_type: "pacbio"           # Long-read platform: "pacbio" or "nanopore"
output_dir: "results"         # Output directory (relative to the workflow/ directory)
seed: 42                      # Random seed for reproducibility across tools

# ==============================================================================
# Input Data
# ==============================================================================
metadata: "test_data/test_metadata.csv"
factors: "test_data/test_factors.csv"

# Short-read comparison (optional)
sr_analysis: false

# ==============================================================================
# Reference Files
# ==============================================================================
reference_genome: "test_data/tiny_genome.fa"
reference_annotation: "test_data/tiny_annotation.gtf"

# ==============================================================================
# Tools & Analysis
# ==============================================================================
tools: ["kallisto", "bambu", "flair"]

sqanti_dir: "SQANTI3"
normalization_methods: ["CPM", "TPM"]
min_count_condition: 0

# ==============================================================================
# SIRV Spike-in Controls
# ==============================================================================
sirv_analysis: false

# ==============================================================================
# Optional Analyses
# ==============================================================================
iso_per_gene_analysis: false
replicability_analysis: false
coverage_analysis: false

# ==============================================================================
# Reporting
# ==============================================================================
report_factors: ["Tissue", "Pool"]
